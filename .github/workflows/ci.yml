name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Unit tests (Zig 0.15.2)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Install Zig 0.15.2"
        run: |
          ARCH=$(dpkg --print-architecture)
          if [ "$ARCH" = "amd64" ]; then ZIG_ARCH="x86_64"; else ZIG_ARCH="aarch64"; fi
          curl -fsSL "https://ziglang.org/download/0.15.2/zig-${ZIG_ARCH}-linux-0.15.2.tar.xz" \
            | tar -xJ -C /opt
          echo "/opt/zig-${ZIG_ARCH}-linux-0.15.2" >> "$GITHUB_PATH"

      - name: "Verify Zig version"
        run: zig version

      - name: "Run tests"
        run: zig build test

      - name: "Build ReleaseFast"
        run: zig build -Doptimize=ReleaseFast

  docker:
    name: "Docker build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Build Docker image"
        run: docker build --tag gemma4visualizer:ci .
