name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.15.2"

jobs:
  # ── Job 1: Unit tests ─────────────────────────────────────────────────────
  test:
    name: Unit tests (Zig ${{ env.ZIG_VERSION }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          ARCH=$(dpkg --print-architecture)
          case "$ARCH" in
            amd64) ZIG_ARCH="x86_64" ;;
            arm64) ZIG_ARCH="aarch64" ;;
            *) echo "Unsupported arch: $ARCH" && exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_ARCH}-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C /opt
          echo "/opt/zig-${ZIG_ARCH}-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Verify Zig version
        run: zig version

      - name: Run tests
        run: zig build test

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

  # ── Job 2: Docker build ───────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag gemma4visualizer:ci .
